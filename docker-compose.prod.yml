# Runs on the Lighthouse server from ~/apps/auto-crm-automation, next to a .env file
# (see .env.production.example). n8n is not published to the internet: it listens on the
# server's loopback and on the Docker network, where the CRM API reaches it as
# http://auto-crm-n8n:5678. Open the editor through an SSH tunnel.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7
    container_name: auto-crm-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Singapore}
      TZ: ${TIMEZONE:-Asia/Singapore}
      WEBHOOK_URL: http://auto-crm-n8n:5678/
      # The editor is reached over an SSH tunnel on plain http, where a Secure cookie is dropped.
      N8N_SECURE_COOKIE: "false"
      # Workflows read AUTO_CRM_API_URL, AUTO_CRM_API_KEY and AUTO_CRM_LEAD_OWNER_ID via $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile"]'
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - auto-crm-net

volumes:
  n8n_data:

networks:
  auto-crm-net:
    name: auto-crm-net
    external: true
